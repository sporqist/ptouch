[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[project]
name = "ptouch"
description = "Python library for Brother P-touch label printers"
dynamic = ["version"]
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Nicolai Buchwitz", email = "nb@tipi-net.de" }]
maintainers = [{ name = "Marius Alwan Meyer", email = "22202402+sporqist@users.noreply.github.com" }]
keywords = ["brother", "p-touch", "label", "printer", "raster"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
]
dependencies = [
    "Pillow",
]
requires-python = ">= 3.11"

[project.urls]
Documentation = "https://ptouch.readthedocs.io/"
Repository = "https://github.com/sporqist/ptouch"
Issues = "https://github.com/sporqist/ptouch/issues"
Upstream = "https://github.com/nbuchwitz/ptouch"

[project.optional-dependencies]
usb = ["pyusb"]
dev = ["ruff", "mypy"]
test = ["pytest", "pytest-cov", "pyusb"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=1.24",
]

[project.scripts]
ptouch = "ptouch.__main__:main"

[tool.setuptools.package-dir]
"" = "src"

# Version comes from git tags. Fork releases are tagged with a local
# version part on top of the upstream release they build on, e.g.
# v1.1.0+sporq.1, so they can never be confused with (or uploaded as)
# an upstream PyPI release.
[tool.setuptools_scm]

[tool.ruff]
line-length = 100
lint.select = [
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # Pyflakes
    "Q",   # flake8-quotes
]
lint.ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "D107",   # undocumented-public-init
    "ANN401", # allow Any type (needed for pyusb which lacks type stubs)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

# pyusb ships neither type hints nor a py.typed marker.
[[tool.mypy.overrides]]
module = ["usb", "usb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/ptouch"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
