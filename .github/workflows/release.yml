name: Release

on:
  push:
    tags:
      - "v*"

# Fork of nbuchwitz/ptouch: releases go to GitHub only. The PyPI name
# `ptouch` belongs to upstream, and fork versions carry a local part
# (e.g. 1.1.0+sporq.1) that PyPI rejects by design.
permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
